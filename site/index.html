<style>
:root{--bg:#fbfbfa;--ink:#17191c;--muted:#6b7079;--faint:#9aa0a8;--line:#e7e7e4;--hover:#f3f3f1;--accent:#2557a7;
  --open:#1a8a4a;--roll:#2557a7;--up:#c27a12;--closed:#a3a8ae;--check:#8a63d2;--def:#c0392b;--panel:#fff;--shadow:0 10px 40px rgba(0,0,0,.10)}

*{box-sizing:border-box}

a{color:var(--accent);text-decoration:none}
.wrap{max-width:760px;margin:0 auto;padding:22px 22px 90px}
/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:.88rem}
.brand{display:inline-flex;align-items:center;gap:10px}.logo{width:38px;height:38px;color:var(--ink);flex:none}.brand .bt{font-size:.98rem;color:var(--ink)}.brand .bt span{color:var(--faint)}
.toprow{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:64px 0 16px}.toprow h1{margin:0}.toprow .who{margin:0 0 4px;flex-direction:column;align-items:flex-end;gap:5px;font-size:.78rem}

.brand{font-weight:700;letter-spacing:-.01em}

.links{display:flex;gap:18px}

textarea{width:100%;min-height:118px;resize:vertical;font:inherit;font-size:1.05rem;line-height:1.5;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);outline:none;transition:border-color .15s, box-shadow .15s}

.under{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.under .sub{margin:0}
.top3{margin:14px 0 4px}.t3g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

.src-c h3{margin:0 0 4px;font-size:.98rem}.stamp{font-size:.72rem;color:var(--accent);margin-top:6px;opacity:.85}.src-c .meta{font-size:.82rem}.src-c ul{margin:8px 0 0;padding-left:18px;font-size:.86rem}.src-c li{margin:2px 0}
.addsrc{display:grid;gap:8px;max-width:560px;margin-top:10px}.addsrc input,.addsrc select{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink)}

  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--accent) 45%,transparent) 75%,var(--accent));border-radius:0 4px 4px 0;height:3px;top:3px}

.prow{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:600px){.prow{grid-template-columns:1fr}}

.btn.solid{background:var(--accent);border-color:var(--accent);color:#fff}.btn.solid:hover{filter:brightness(1.08)}

<script>
(function(){
const S=window.SCHEMES,G=window.GROUPS,IND=window.INDUSTRIES,STG=window.STAGES,PUR=window.PURPOSES,KW=window.KEYWORDS;
const byId=Object.fromEntries(S.map(s=>[s.id,s]));
const TODAY=new Date();TODAY.setHours(0,0,0,0);
const store={get(k,d){try{const v=localStorage.getItem('ff3:'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('ff3:'+k,JSON.stringify(v))}catch(e){}}};
const st0=Object.assign({mode:"uni",text:"",inds:null,stage:null,size:null,mil:false,partner:null,view:"map",saved:[],cmp:[]},store.get('s',{}));const st=st0;st.mil=true;if(!Array.isArray(st.saved))st.saved=[];if(!Array.isArray(st.cmp))st.cmp=[];
let showAll=false;
const save=()=>store.set('s',{mode:st.mode,text:st.text,inds:st.inds,stage:st.stage,size:st.size,mil:st.mil,partner:st.partner,view:st.view,saved:st.saved,cmp:st.cmp});

// --- helpers
const d=s=>s?new Date(s+"T00:00:00"):null;
function live(s){const dl=d(s.deadline),op=d(s.opens);
  if(s.status==="open"&&dl&&dl<TODAY)return"closed";
  if(s.status==="upcoming"&&op&&op<=TODAY&&(!dl||dl>=TODAY))return"open";return s.status;}
const left=s=>{const dl=d(s.deadline);return dl?Math.round((dl-TODAY)/864e5):null};
const fmt=x=>x.toLocaleDateString('en-IE',{day:'numeric',month:'short',year:'numeric'});
function stTxt(s){const l=live(s),n=left(s);
  if(l==="open")return n!=null?`<span class="${n<=21?'soon':'t-open'}">${n===0?'Closes today':n===1?'1 day left':n+' days left'}</span>`:'<span class="t-open">Open</span>';
  return {rolling:"Any time",upcoming:"Opening soon",closed:"Closed for now",check:"Check dates"}[l];}
const WHO={uni:"University",co:"Company",both:"University or company"};
const neutral=s=>s.ind.length>=5;
const modeOk=s=>s.who==="both"||s.who===st.mode;
const allowed=s=>modeOk(s)&&(st.mil||s.mil!=="defence");
const short=t=>t.split(/[;(]|\.\s/)[0].replace(/\.$/,'');
const SIZES={s:["Up to €50k",x=>x!=null&&x<=5e4],m:["€50k–250k",x=>x>5e4&&x<=25e4],l:["€250k–1m",x=>x>25e4&&x<=1e6],xl:["Over €1m",x=>x>1e6]};
const sizeOf=s=>Object.keys(SIZES).find(k=>SIZES[k][1](s.max))||"v";
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function pLabel(s){const p=s.partner;if(!p||p.need==='optional')return'';
  const k={intl:'Consortium',irish:'Irish consortium',cross:'Cross-border partner',industry:st.mode==='uni'?'Company partner':'Research partner'}[p.kind];
  return (p.need==='usually'?'Usually a ':'')+(p.need==='usually'?k.toLowerCase():k);}
function row(s,why){const pl=pLabel(s);return `<button class="row" data-id="${s.id}"><span class="dot c-${live(s)}"></span><span class="main"><div class="nm">${s.name}${pl?`<span class="kind ptag" title="You need partners to apply">${pl}</span>`:''}</div><div class="sm">${G[s.group].label} · ${short(s.amount)}</div>${why?`<div class="why">${why}</div>`:''}</span><span class="st">${stTxt(s)}</span></button>`;}

// --- idea matching (see match.js)
const indsNow=()=>st.inds??Matcher.detectInds(st.text,KW);
const rank=()=>Matcher.rank(S,{sem:semNow(),ctx:prof(),text:st.text,inds:st.inds,mode:st.mode,mil:st.mil,stage:st.stage,size:st.size,partner:st.partner,today:TODAY});
// --- home
const ideaEl=document.getElementById('idea');
function renderHome(){
  const has=st.text.trim().length>2;
  document.getElementById('res').hidden=!has;if(!has)document.getElementById('picks').innerHTML='';
  if(!has){searching=0;document.getElementById('sbar').className='sbar';document.getElementById('res').classList.remove('busy');document.getElementById('sub').textContent="";}
  const listView=has&&st.view==='list';
  document.querySelectorAll('#viewSeg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===(listView?'list':'map')));
  document.getElementById('list').hidden=!listView;document.getElementById('homeMap').hidden=listView;document.getElementById('viewSeg').hidden=!has;document.getElementById('tres').hidden=!has;
  document.getElementById('mapSec').classList.toggle('withidea',has);
  if(!listView)renderMap();
  if(pendingMapScroll){pendingMapScroll=false;setTimeout(()=>document.getElementById('mapSec').scrollIntoView({behavior:'smooth'}),60);}
  if(!has)return;
  const R=rank(), inds=R.inds;
  const needTxt=R.needs.length?` · looking for <b>${R.needs.map(n=>PUR[n].label.toLowerCase()).join(", ")}</b>`:"";
  document.getElementById('touches').innerHTML=(profOn()?`<a href="#profile" class="ptag">Tuned to ${esc(prof().name||'your profile')}</a> · `:'')+(inds.length?`Relevant to <b>${inds.map(i=>IND[i].split(/,| &/)[0]).join(", ")}</b>`:'')+(inds.length?needTxt:needTxt.replace(/^\s*·\s*/,''));
  const spec=showAll?R.results.filter(x=>x.specialist):Matcher.fieldPicks(R,5), gen=R.results.filter(x=>!x.specialist), k=showAll?99:5;
  const sec=(t,a)=>a.length?`<div class="month" style="margin-top:22px">${t}</div><div class="list" style="margin-top:6px">${a.slice(0,k).map(x=>row(x.s,x.why)).join("")}</div>`:"";
  document.getElementById('list').innerHTML=(sec(inds.length?"Made for your field":"",inds.length?spec:[])+sec(inds.length?"Open to any field":"Best matches",gen))||'<div class="empty">Nothing matches. Try removing a refinement.</div>';
  document.getElementById('list').style.borderTop="0";
  const TMall=Matcher.matchTenders(T,st.text,{sem:semNow(),today:TODAY,mil:st.mil,related:true});const TM=TMall.filter(x=>!x.related),TR=TMall.filter(x=>x.related).sort((a,b)=>b.score-a.score).slice(0,3);
  const esaQ=encodeURIComponent(liveTerms(st.text));
  const liveLine=`<div class="livesearch">Also search live: <a href="https://esastar-publication-ext.sso.esa.int/search?s=${esaQ}" target="_blank" rel="noopener">ESA tenders for “${esc(liveTerms(st.text))}” ↗</a> · <a href="https://ec.europa.eu/info/funding-tenders/opportunities/portal/screen/opportunities/calls-for-tenders" target="_blank" rel="noopener">EU tenders ↗</a> · <a href="https://www.etenders.gov.ie/" target="_blank" rel="noopener">Irish eTenders ↗</a>${myS().length?' · '+srcLinks(liveTerms(st.text)):''}<span>New tenders appear daily, and this tool holds a ${fmt(d(window.TENDER_META.snapshot))} snapshot, so check live before relying on it.</span></div>`;
  const liveLinks=`<a href="https://esastar-publication-ext.sso.esa.int/search?s=${esaQ}" target="_blank" rel="noopener">ESA ↗</a> · <a href="https://ec.europa.eu/info/funding-tenders/opportunities/portal/screen/opportunities/calls-for-tenders" target="_blank" rel="noopener">EU ↗</a> · <a href="https://www.etenders.gov.ie/" target="_blank" rel="noopener">Irish eTenders ↗</a>${myS().length?' · '+srcLinks(liveTerms(st.text)):''}`;
  const relLine=TR.length?`<div class="related"><b>Possibly related:</b> ${TR.map(x=>`<button class="tlink" data-tid="${x.t.id}">${esc(x.t.title)}</button> <span class="meta">(shares “${x.shown.slice(0,2).join('”, “')}”)</span>`).join(' · ')}</div>`:'';
  const liveBlk=liveHTML(st.text);
  document.getElementById('tmatch').innerHTML=TM.length?`<div class="flag"><div class="fh"><span>⚑ ${TM.length===1?'Your idea matches a tender or challenge':'Your idea matches '+TM.length+' tenders or challenges'}</span><a class="tlink" href="#" data-gobr="tenders">All tenders ↓</a></div>${TM.slice(0,4).map(x=>tRow(x.t,'Matched on '+x.shown.slice(0,4).map(h=>'“'+h+'”').join(', '))).join('')}${relLine}${liveBlk}${liveLine}</div>`:(TR.length||(LIVEDATA&&liveMatches(st.text).length))?`<div class="flag quiet"><div class="fh"><span>⚑ Possibly related tenders</span><a class="tlink" href="#" data-gobr="tenders">All tenders ↓</a></div>${relLine}${liveBlk}${liveLine}</div>`:`<div class="livemini">Search tenders live: ${liveLinks}</div>`;
  renderPicks(R);
  searchDone(R,TM);
  const nSpec=R.results.filter(x=>x.specialist).length;
  const mb=document.getElementById('moreBtn');mb.hidden=st.view!=='list'||(nSpec<=5&&gen.length<=5);mb.textContent=showAll?"Show fewer":`Show all ${R.results.length} matches`;
}
function chipSet(id,items,on,click){const el=document.getElementById(id);el.innerHTML=Object.entries(items).map(([k,v])=>`<button class="chip sm" data-k="${k}" aria-pressed="${on(k)}">${v}</button>`).join("");
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>click(b.dataset.k));}
// --- search feedback: one calm sweep per burst of typing, then a quiet "done"
let searching=0,searchT0=0,searchTO,lastPicks='';
function searchStart(){const v=ideaEl.value.trim();if(v.length<=2)return;clearTimeout(searchTO);
  if(searching)return;searching=1;searchT0=performance.now();
  document.getElementById('sbar').className='sbar run';
  const res=document.getElementById('res');if(!res.hidden)res.classList.add('busy');
  }
function searchDone(R,TM){if(!searching)return;const wait=Math.max(0,900-(performance.now()-searchT0));
  clearTimeout(searchTO);searchTO=setTimeout(()=>{searching=0;const b=document.getElementById('sbar'),res=document.getElementById('res');b.className='sbar done';
    res.classList.remove('busy');const ids=[...document.querySelectorAll('#picks .pick')].map(x=>x.dataset.id).join();
    if(ids!==lastPicks){lastPicks=ids;res.classList.remove('fresh');void res.offsetWidth;res.classList.add('fresh');}
    setTimeout(()=>{if(!searching)b.className='sbar'},1300);},wait);}
let t;ideaEl.addEventListener('input',()=>{mapSt.overview=false;searchStart();clearTimeout(t);t=setTimeout(()=>{st.text=ideaEl.value;st.inds=null;showAll=false;go();if(SEM.state==='off')semInit();else semRun();},450);});
document.getElementById('moreBtn').onclick=()=>{showAll=!showAll;go();};
const milEl=document.getElementById('mil');milEl.onchange=()=>{st.mil=milEl.checked;searchStart();go();};
document.querySelectorAll('.seg button[data-mode]').forEach(b=>b.onclick=()=>{st.mode=b.dataset.mode;searchStart();go();});
let pendingMapScroll=false;
document.addEventListener('click',e=>{const a=e.target.closest('[data-gobr]');if(!a)return;e.preventDefault();mapSt.sel=a.dataset.gobr;mapSt.overview=true;renderMap();document.getElementById('mapSec').scrollIntoView({behavior:'smooth'});});
document.querySelectorAll('#viewSeg button').forEach(b=>b.onclick=()=>{st.view=b.dataset.view;save();renderHome();});
function renderSoon(has){const el=document.getElementById('soon');if(has){el.innerHTML='';return;}
  const ev=events().filter(e=>e.k==='Closes'&&(e.dt-TODAY)/864e5<=75).slice(0,4);
  el.innerHTML=ev.length?`<div class="soon"><div class="soon-h"><span>Closing soon</span></div>${ev.map(e=>{const it=e.s||e.t,n=Math.round((e.dt-TODAY)/864e5);return `<button class="soon-i" ${e.t?`data-tid="${it.id}"`:`data-id="${it.id}"`}><b>${e.dt.toLocaleDateString('en-IE',{day:'numeric',month:'short'})}</b><span>${e.t?it.title:it.name}</span><i>${n===0?'today':n===1?'tomorrow':n+' days'}</i></button>`;}).join('')}</div>`:'';}

// --- need page
function renderNeed(k){const p=PUR[k];if(!p){location.hash="";return;}
  const items=S.filter(s=>allowed(s)&&s.purpose.includes(k)).sort((a,b)=>ord(a)-ord(b));
  document.getElementById('v-need').innerHTML=`<a href="#" class="back">← Back</a><h1 style="margin-top:20px">${p.label}</h1><p class="meta" style="margin-top:-8px">${p.desc} Showing ${items.length} for a ${st.mode==='uni'?'university team':'company'}.</p><div class="list">${items.map(s=>row(s)).join("")||'<div class="empty">Nothing here for this applicant type. Switch to '+(st.mode==='uni'?'Company':'University team')+' on the home page.</div>'}</div>`;}
const ORD={open:0,upcoming:1,rolling:2,check:3,closed:4};
const ord=s=>ORD[live(s)]*1000+(left(s)??999);

// --- all
const qEl=document.getElementById('q');qEl.oninput=()=>renderAll();
function renderAll(){const q=qEl.value.toLowerCase().trim();
  const items=S.filter(s=>allowed(s)&&(!q||(s.name+" "+s.summary+" "+G[s.group].label+" "+s.type).toLowerCase().includes(q)));
  let h="";Object.entries(G).forEach(([k,g])=>{const it=items.filter(s=>s.group===k).sort((a,b)=>ord(a)-ord(b));if(it.length)h+=`<div class="month">${g.label}</div><div class="list" style="margin-top:6px">${it.map(s=>row(s)).join("")}</div>`;});
  document.getElementById('allList').innerHTML=(h||'<div class="empty">No matches.</div>')+`<p class="meta" style="margin-top:18px">Showing ${items.length} schemes for a ${st.mode==='uni'?'university team':'company'}. Switch on the home page.</p>`;}

// --- deadlines
// --- upcoming events (for Closing soon)
function events(){const ev=[];
  S.filter(allowed).forEach(s=>{const dl=d(s.deadline),op=d(s.opens);if(dl&&dl>=TODAY)ev.push({dt:dl,k:"Closes",s});if(op&&op>=TODAY)ev.push({dt:op,k:"Opens",s});});
  T.filter(tAllowed).forEach(t=>{const dl=d(t.deadline),op=d(t.opens);if(dl&&dl>=TODAY&&tLive(t)!=="intended")ev.push({dt:dl,k:"Closes",t});if(op&&op>TODAY)ev.push({dt:op,k:"Opens",t});});
  return ev.sort((a,b)=>a.dt-b.dt);}
const key=x=>x.toISOString().slice(0,10);
const ymd=x=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
function evRow(e){const n=Math.round((e.dt-TODAY)/864e5),it=e.s||e.t;
  return `<button class="row" ${e.t?`data-tid="${it.id}"`:`data-id="${it.id}"`}><span class="dot c-${e.k==='Opens'?'upcoming':'open'}"></span><span class="main"><div class="nm">${e.t?it.title+'<span class="kind">'+it.org+'</span>':it.name}</div><div class="sm">${e.k} ${e.dt.toLocaleDateString('en-IE',{weekday:'short',day:'numeric',month:'short'})} · ${e.t?it.programme:G[it.group].label}</div></span><span class="st ${e.k==='Closes'&&n<=21?'soon':''}">${n===0?'Today':n===1?'Tomorrow':'in '+n+' days'}</span></button>`;}
// --- funding map (radial mind map)
const mapSt={by:'type',sel:null,open:false,prev:{},overview:false};
const TYPES=[['research','Research grants','Money for research projects.'],['industry','Work with industry','Projects done with, or co-funded by, a company.'],['eu','EU & international','Bigger projects with partners in other countries.'],['spinout','Start-ups & spin-outs','Turning results into a product or company, including investment.'],['company','Company R&D grants','Grants and tax credits for a company\'s own R&D.'],['people','PhDs & fellowships','Salaries for PhDs, postdocs and fellows.'],['services','Free help & facilities','Free or subsidised testing, equipment, computing and expert help.']];
const TYPE_OVR={"arc-ict":"research","arc-health":"research","arc-ther":"research","philab":"research","spark":"research","ei-dsr":"company"};
function stype(s){if(TYPE_OVR[s.id])return TYPE_OVR[s.id];const P=s.purpose;
  if(s.group==='TAX')return'company';if(P.includes('invest'))return'spinout';if(P[0]==='people')return'people';
  if(P[0]==='infra'||(P.includes('infra')&&!P.includes('research')))return'services';
  if((s.partner&&s.partner.kind==='intl'&&s.partner.need!=='optional')||(s.group==='EU'&&P.includes('intl')))return'eu';
  if(P.includes('commercialise'))return'spinout';if(P[0]==='companyrd'||(P.includes('companyrd')&&s.who==='co'))return'company';
  if(P.includes('industry'))return'industry';if(P.includes('people'))return'people';return'research';}
const PMAX={"msca-dn":3e6,"msca-pf":2.5e5,"cleanh2":3e6,"i3":6e6,"edf":1e7,"eic-step-def":1e7};

// say its name: an idea that is just "comet" gets a wave back
let cometSaid=false;document.addEventListener('input',e=>{if(e.target.id!=='idea')return;const v=e.target.value.trim().toLowerCase().replace(/[!.☄ ]/g,'');if(v==='comet'&&!cometSaid){cometSaid=true;cometStreak(2);toast('☄ Hello from COMET<span>Now tell me about your idea.</span>',3500);}if(v!=='comet')cometSaid=false;});
// once in a while, a quiet shooting star crosses the map
setTimeout(function star(){if(!document.hidden&&!document.getElementById('v-home').hidden&&!matchMedia('(prefers-reduced-motion:reduce)').matches){const m=document.getElementById('mapSec');if(m){const s=document.createElement('i');s.className='mapstar';m.appendChild(s);setTimeout(()=>s.remove(),2600);}}setTimeout(star,45000+Math.random()*60000);},30000);
console.log('%c☄ Funding Finder%c\ndeveloped by COMET','font:700 15px system-ui;color:#2557a7','font:12px system-ui;color:#777');
// --- share a search
function toast(msg,ms){const t=document.getElementById('toast');t.innerHTML=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,ms||3500);}
function shareURL(){const p=new URLSearchParams();p.set('q',st.text.trim());p.set('m',st.mode);if(mapSt.by!=='need')p.set('by',mapSt.by);if(st.partner)p.set('p',st.partner);if(st.view==='list')p.set('v','list');if(st.mil)p.set('mil','1');
  return location.href.split('#')[0]+'#find?'+p.toString();}
function applyShare(qs){const p=new URLSearchParams(qs);const q=p.get('q');if(q!=null){st.text=q;ideaEl.value=q;}if(['uni','co'].includes(p.get('m')))st.mode=p.get('m');
  if(p.get('by'))mapSt.by=p.get('by');st.partner=['solo','team'].includes(p.get('p'))?p.get('p'):null;st.view=p.get('v')==='list'?'list':'map';st.mil=p.get('mil')==='1';st.inds=null;mapSt.sel=null;
  history.replaceState(null,'',location.pathname+location.search);}
async function copyText(txt){try{await navigator.clipboard.writeText(txt);return true;}catch(e){const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy');}catch(_){}ta.remove();return ok;}}
document.getElementById('shareTop').onclick=async e=>{e.preventDefault();shareGo();};
const shareGo=async()=>{const url=shareURL();const hosted=/^https?:/.test(location.protocol)&&window.top===window;
  const txt=`Funding Finder search (${st.mode==='uni'?'university team':'company'}): “${st.text.trim()}”\n${url}`;const ok=await copyText(txt);
  toast(ok?(hosted?'Link copied. Anyone who opens it sees this search.':'Copied the search and a link. <span>The link opens this search once the tool is hosted online. Until then colleagues can paste the idea into their own copy.</span>'):'Couldn\'t copy automatically. Here\'s the link:<br><input readonly value="'+esc(url)+'" onclick="this.select()">',hosted||!ok?6000:7000);};

// --- compare
const inCmp=id=>st.cmp.includes(id);
function cmpBtn(id){return `<button class="savebtn" data-cmp="${id}" aria-pressed="${inCmp(id)}">${inCmp(id)?'⇄ In comparison':'⇄ Compare'}</button>`;}
function toggleCmp(id){const i=st.cmp.indexOf(id);if(i>=0)st.cmp.splice(i,1);else{if(st.cmp.length>=3){toast('You can compare up to 3 routes. Remove one first.');return;}st.cmp.push(id);}save();cmpBar();
  const b=dr.querySelector('[data-cmp]');if(b){b.setAttribute('aria-pressed',inCmp(id));b.textContent=inCmp(id)?'⇄ In comparison':'⇄ Compare';}if(location.hash==='#compare')renderCompare();}
function cmpBar(){const b=document.getElementById('cmpbar');st.cmp=st.cmp.filter(id=>byId[id]);
  if(!st.cmp.length||location.hash==='#compare'){b.hidden=true;return;}b.hidden=false;
  b.innerHTML=`<span>${st.cmp.length} route${st.cmp.length>1?'s':''} to compare${st.cmp.length<2?'<i> · add another</i>':''}</span><a class="btn" href="#compare">Compare</a><button class="tlink" id="cmpClear">Clear</button>`;
  b.querySelector('#cmpClear').onclick=()=>{st.cmp=[];save();cmpBar();};}
function statusLine(s){const l=live(s),n=left(s);return l==='open'&&s.deadline?`Open · closes ${fmt(d(s.deadline))}${n!=null?` (${n} days)`:''}`:l==='rolling'?'Apply any time':l==='upcoming'?'Opening soon'+(s.deadline?` · deadline ${fmt(d(s.deadline))}`:''):l==='closed'?'Closed for now':'Check dates';}
function renderCompare(){const el=document.getElementById('v-compare');const C=st.cmp.map(id=>byId[id]).filter(Boolean);
  if(!C.length){el.innerHTML=`<a href="#" class="back">← Back</a><h1 style="margin-top:20px">Compare routes</h1><p class="meta">Nothing to compare yet. Open any route and press <b>⇄ Compare</b> (up to 3).</p>`;return;}
  const rows=[['Funder',s=>G[s.group].label],['Amount',s=>s.amount],['Funding rate',s=>s.rate],['Status',s=>statusLine(s)+(s.next?`<div class="meta">${s.next}</div>`:'')],['Effort',s=>EFFL[effort(s)]+' <span class="meta">(estimate)</span>'],
    ['Partners',s=>s.partner&&s.partner.need!=='optional'?`<b>${s.partner.need==='usually'?'Usually':'Required'}</b>: ${s.partner.who}`:'Can apply alone'],['Who can apply',s=>WHO[s.who]],['Stage',s=>STG[s.stage].label],['Duration',s=>s.duration],
    ['Key requirements',s=>`<ul>${s.req.map(r=>`<li>${r}</li>`).join('')}</ul>`],['How to apply',s=>s.apply],['Official page',s=>`<a href="${s.src}" target="_blank" rel="noopener">Visit ↗</a>`]];
  el.innerHTML=`<a href="#" class="back">← Back</a><h1 style="margin-top:20px">Compare routes</h1><p class="meta" style="margin-top:-8px">${C.length<2?'Add one or two more routes to compare (open a route, then press ⇄ Compare).':'Side by side. Open a column title for full details.'}</p>
  <div class="cmpwrap"><table class="cmp"><thead><tr><th></th>${C.map(s=>`<th><button class="cmpname" data-id="${s.id}">${s.name}</button><button class="cmpx" data-rm="${s.id}" aria-label="Remove ${esc(s.name)}">×</button></th>`).join('')}</tr></thead>
  <tbody>${rows.map(([l,f])=>`<tr><th scope="row">${l}</th>${C.map(s=>`<td>${f(s)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  el.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{toggleCmp(b.dataset.rm);renderCompare();});
  el.querySelectorAll('.cmpname').forEach(b=>b.onclick=()=>open(b.dataset.id));}

// --- eligibility quick-check
const CONTACT={EI:'your Enterprise Ireland Development Adviser (or your TTO for university projects)',RI:'your university Research Office',ARC:'the ARC Hub team and your Research Office',SEAI:'SEAI’s RD&D team or your Research Office',ESA:'Enterprise Ireland’s ESA/space team',DEF:'Enterprise Ireland’s defence, security & resilience team',EU:'your Research Office and the Horizon Europe national contact point',LEO:'your Local Enterprise Office',TAX:'your accountant or Revenue',OTH:'the programme contact on the official page'};
function eligQs(s){const Q=[];
  if(['EI','RI','ARC','SEAI','LEO','TAX','DEF'].includes(s.group))Q.push({k:'irl',q:'Is the applicant based in Ireland (or setting up here)?',no:'This is an Irish national scheme, so the applicant needs an Irish base.'});
  if(s.who!=='both')Q.push({k:'who',q:`Are you applying as ${s.who==='uni'?'a university or research organisation':'a company'}?`,no:`This route is for ${s.who==='uni'?'universities and research organisations':'companies'} only.`});
  const p=s.partner;if(p&&p.need!=='optional')Q.push({k:'partner',q:`Do you have this lined up (or could you in a few weeks)? ${p.who}.`,no:'You need partners for this one.'+pFind(s)});
  const l=live(s),n=left(s);
  if(l==='open'&&s.deadline)Q.push({k:'time',q:`Could you submit a full application by ${fmt(d(s.deadline))} (${n} days)?`,no:s.next?`Next round: ${s.next}`:'Look for the next round on the official page.'});
  else if(l==='closed'||l==='upcoming')Q.push({k:'time',q:`Can you wait for the next round? ${s.next||'Dates not yet published.'}`,no:'Consider a route that is open now.'});
  const pr=s.req.filter(r=>!/partner|consorti/i.test(r));for(const r of pr){if(Q.length>=5)break;Q.push({k:'r'+Q.length,q:`Can you meet this? “${r}”`,no:'This is a stated requirement of the scheme.'});}
  if(Q.length<3)Q.push({k:'stage',q:`Is your work at roughly this stage: <b>${STG[s.stage].label}</b>?`,no:'This route is aimed at a different stage. Check <b>Natural next step</b> below.'});
  return Q.slice(0,5);}
function eligHTML(s){return `<div class="elig" id="elig"><button class="eligbtn" id="eligBtn" aria-expanded="false">✓ Am I eligible? <span>Quick check, 30 seconds</span></button><div id="eligBody" hidden></div></div>`;}
function wireElig(s){const btn=dr.querySelector('#eligBtn');if(!btn)return;const Q=eligQs(s),A={};
  const draw=()=>{const body=dr.querySelector('#eligBody');
    const ans=Q.map(q=>A[q.k]),nos=Q.filter(q=>A[q.k]==='no'),uns=Q.filter(q=>A[q.k]==='ns'),done=ans.every(Boolean);
    let v='';if(nos.length)v=`<div class="ev bad"><b>Probably not a fit right now.</b><ul>${nos.map(q=>`<li>${q.no}</li>`).join('')}</ul>${(s.leads||[]).filter(x=>byId[x]&&allowed(byId[x])).length?'See <b>Natural next step</b> below for related routes.':''}</div>`;
    else if(done&&uns.length)v=`<div class="ev mid"><b>Possibly.</b> Check the ${uns.length} point${uns.length>1?'s':''} you weren’t sure about with ${CONTACT[s.group]||CONTACT.OTH}.</div>`;
    else if(done)v=`<div class="ev good"><b>Looks like a fit.</b> Next: read the call documents on the official page and talk to ${CONTACT[s.group]||CONTACT.OTH}.</div>`;
    body.innerHTML=Q.map(q=>`<div class="eq"><p>${q.q}</p><div class="eopts" role="group">${[['yes','Yes'],['no','No'],['ns','Not sure']].map(([k,t])=>`<button data-q="${q.k}" data-a="${k}" aria-pressed="${A[q.k]===k}">${t}</button>`).join('')}</div></div>`).join('')+v+`<p class="meta">Indicative only. The call documents decide eligibility.</p>`;
    body.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{A[b.dataset.q]=b.dataset.a;draw();});};
  btn.onclick=()=>{const body=dr.querySelector('#eligBody');body.hidden=!body.hidden;btn.setAttribute('aria-expanded',!body.hidden);if(!body.hidden)draw();};}

// --- saved list
const isSaved=k=>st.saved.includes(k);
function saveBtn(k){return `<button class="savebtn" data-save="${k}" aria-pressed="${isSaved(k)}">${isSaved(k)?'★ Saved':'☆ Save to my list'}</button>`;}
function toggleSave(k){const i=st.saved.indexOf(k);i>=0?st.saved.splice(i,1):st.saved.push(k);save();savedLink();
  const b=dr.querySelector('[data-save]');if(b){b.setAttribute('aria-pressed',isSaved(k));b.textContent=isSaved(k)?'★ Saved':'☆ Save to my list';}
  if(location.hash==='#saved')renderSaved();}
function savedLink(){const a=document.getElementById('savedLink');a.hidden=!st.saved.length;a.textContent=`Saved (${st.saved.length})`;}
function savedItems(){return st.saved.map(k=>k.startsWith('t:')?{k,t:tById[k.slice(2)]}:{k,s:byId[k]}).filter(x=>x.t||x.s);}
function savedText(){return savedItems().map(x=>{if(x.t){const t=x.t;return `• ${t.title} (ESA ${t.kind}${t.deadline?', closes '+fmt(d(t.deadline)):''})\n  ${t.url}`;}
  const s=x.s;return `• ${s.name} — ${short(s.amount)} — ${s.deadline?'deadline '+fmt(d(s.deadline)):({rolling:'apply any time',check:'check dates',closed:'closed for now',upcoming:'opening soon',open:'open'})[live(s)]}\n  ${s.src}`;}).join('\n');}
function renderSaved(){const it=savedItems();
  let h=`<h1>Saved</h1><p class="meta" style="margin-top:-8px">Your shortlist, kept in this browser only. Copy it to share with your team.</p>`;
  h+=it.length?`<div class="list">${it.map(x=>x.t?tRow(x.t):row(x.s)).join('')}</div><div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap"><button class="btn" id="copySaved">Copy list</button><button class="btn" id="clearSaved">Clear</button></div><textarea id="savedTxt" readonly hidden style="margin-top:12px;min-height:160px;font-size:.85rem"></textarea>`:`<div class="empty">Nothing saved yet. Open any scheme or tender and choose "Save to my list".</div>`;
  document.getElementById('v-saved').innerHTML=h;
  const c=document.getElementById('copySaved');if(c)c.onclick=async()=>{const txt=savedText();try{await navigator.clipboard.writeText(txt);c.textContent='Copied ✓';setTimeout(()=>c.textContent='Copy list',1800);}catch(e){const ta=document.getElementById('savedTxt');ta.hidden=false;ta.value=txt;ta.select();c.textContent='Select and copy the text below';}};
  const cl=document.getElementById('clearSaved');if(cl)cl.onclick=()=>{st.saved=[];save();savedLink();renderSaved();};}

// --- drawer
const dr=document.getElementById('dr'),scrim=document.getElementById('scrim');
function open(id){const s=byId[id];if(!s)return;const l=live(s),n=left(s);
  const status=l==="open"&&s.deadline?`Open, closes ${fmt(d(s.deadline))}${n!=null?` (${n} days)`:''}`:l==="rolling"?"Apply any time":l==="upcoming"?(s.deadline?`Opening soon. Deadline ${fmt(d(s.deadline))}`:"Opening soon"):l==="closed"?"Closed for now":"Check dates";
  const nexts=(s.leads||[]).filter(x=>byId[x]&&allowed(byId[x]));
  dr.innerHTML=`<button class="x" aria-label="Close">×</button><div class="fd">${G[s.group].label}</div><h2>${s.name}</h2><p class="sum">${s.summary}</p>
  <a class="visit" href="${s.src}" target="_blank" rel="noopener">Visit official page ↗<span>${s.src.replace(/^https?:\/\/(www\.)?/,'').split('/')[0]}</span></a>
  <dl class="facts"><dt>Amount</dt><dd>${s.amount}</dd><dt>Effort</dt><dd>${EFFL[effort(s)]} <span class="meta">(estimate)</span></dd><dt>Who</dt><dd>${WHO[s.who]}</dd>${s.partner?`<dt>Partners</dt><dd>${s.partner.need==='optional'?'Optional. ':s.partner.need==='usually'?'Usually needed. ':'<b>Required.</b> '}${s.partner.who}${s.partner.need!=='optional'?pFind(s):''}</dd>`:`<dt>Partners</dt><dd>Not needed; you can apply alone</dd>`}<dt>Status</dt><dd>${status}${s.next?`<div class="meta">${s.next}</div>`:''}</dd></dl>
  ${eligHTML(s)}
  <h3>You'll need</h3><ul>${s.req.map(r=>`<li>${r}</li>`).join("")}</ul>
  <h3>How to apply</h3><p class="t">${s.apply}</p>
  ${s.tip?`<h3>Tip</h3><p class="t">${s.tip}</p>`:''}
  ${nexts.length?`<h3>Natural next step</h3><div class="nx">${nexts.map(x=>`<button data-id="${x}">${byId[x].name} →</button>`).join("")}</div>`:''}
  <details><summary>More details</summary><dl class="facts" style="border:0"><dt>Rate</dt><dd>${s.rate}</dd><dt>Duration</dt><dd>${s.duration}</dd><dt>Type</dt><dd>${s.type}</dd><dt>Stage</dt><dd>${STG[s.stage].label}</dd>${s.mil!=='civil'?`<dt>Defence</dt><dd>${s.mil==='dual'?'Dual-use':'Defence programme'}</dd>`:''}</dl></details>
  ${checksHTML(s)}
  ${partnersHTML(s)}
  <div class="drbtns">${saveBtn(s.id)}${cmpBtn(s.id)}</div>
  <h3>Source</h3><p class="t"><a href="${s.src}" target="_blank" rel="noopener">${s.src.replace(/^https?:\/\/(www\.)?/,'').split('/')[0]} ↗</a></p>`;
  showDr();wireElig(s);}
const KL={rc:'Irish research centre',co:'Company in Ireland',ni:'Northern Ireland',eu:'European / UK research',prime:'Industry prime'};
function partnersHTML(s){if(!s.partner||!window.PARTNERS)return '';
  const inds=st.text?window.Matcher.detectInds(st.text,window.KEYWORDS):[];
  const PW=(LIVEDATA&&LIVEDATA.watch)||{},gone=x=>{const w=PW['p:'+x.id];return w&&!w.ok&&w.fails>=4&&(w.http===404||w.http===410||/ENOTFOUND|getaddrinfo|ERR_NAME/i.test(w.error||''));};
  const r=window.Matcher.pickPartners(window.PARTNERS.filter(x=>!gone(x)),s,{text:st.text,mode:st.mode,inds});if(!r)return '';
  const li=x=>`<li><a href="${x.p.url}" target="_blank" rel="noopener">${x.p.name} ↗</a>${knownPartner(x.p.name)?'<span class="kp">Existing partner</span>':''}<span class="pw">${KL[x.p.kind]} · ${x.p.where}</span><span class="pt">${x.p.what}</span>${x.kw.length?`<span class="why">Matches your idea: ${x.kw.slice(0,3).join(', ')}</span>`:''}</li>`;
  const head=r.kind==='intl'?'Possible consortium partners':r.kind==='cross'?(s.id==='ri-usi'?'Possible Northern Ireland partners':'Possible cross-border partners'):r.kind==='irish'?'Possible Irish partners':st.mode==='uni'?'Companies you could approach':'Research groups you could approach';
  const uk=r.uk==='no'?'UK organisations can\'t take part in this call, so they\'re left out.':r.uk==='check'?'UK participation varies for this call; check the call text before inviting a UK partner.':r.uk==='yes'?'UK organisations can be full partners (UK is associated to Horizon Europe and a member of ESA and Eureka).':'';
  const us=s.id==='ri-usi'?' You also need a US partner: search NSF or NIH award databases for groups in your area.':'';
  const empty=`<p class="t">No suggestion fits this idea closely yet. Try the partner search links above.</p>`;
  return `<section class="pp"><h3>${head}</h3>${r.main.length?`<ul class="pl">${r.main.map(li).join('')}</ul>`:empty}
  ${r.local.length?`<p class="sub">Irish partners to bring in</p><ul class="pl">${r.local.map(li).join('')}</ul>`:''}
  <p class="meta" style="margin-top:12px">${[uk+us,'Suggestions to research and approach, not confirmed interest. Check each one\'s current work before you get in touch.'].filter(Boolean).join(' ')}</p></section>`;}
function pFind(s){const L=s.partner.kind==='intl'?[['EU partner search','https://ec.europa.eu/info/funding-tenders/opportunities/portal/screen/how-to-participate/partner-search'],['Enterprise Europe Network','https://een.ec.europa.eu/partnering-opportunities'],['Horizon Europe Ireland contacts','https://www.horizoneurope.ie/']]
  :s.partner.kind==='cross'?[['InterTradeIreland','https://intertradeireland.com/']]
  :[[st.mode==='uni'?'Knowledge Transfer Ireland (find companies)':'Knowledge Transfer Ireland (find researchers)','https://www.knowledgetransferireland.com/']];
  return `<div class="meta">Find partners: ${L.map(([t,u])=>`<a href="${u}" target="_blank" rel="noopener">${t} ↗</a>`).join(' · ')}</div>`;}
function showDr(){dr.classList.add('on');scrim.classList.add('on');dr.scrollTop=0;
  dr.querySelector('.x').onclick=close;dr.querySelectorAll('.nx button').forEach(b=>b.onclick=()=>open(b.dataset.id));
  const sb=dr.querySelector('[data-save]');if(sb)sb.onclick=()=>toggleSave(sb.dataset.save);const cb=dr.querySelector('[data-cmp]');if(cb)cb.onclick=()=>toggleCmp(cb.dataset.cmp);
  setTimeout(()=>dr.querySelector('.x').focus(),50);}
function close(){dr.classList.remove('on');scrim.classList.remove('on');}
scrim.onclick=close;document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});
document.addEventListener('click',e=>{const r=e.target.closest('.row,.mleaf,.soon-i,.mn-leaf,.mn-dot,.pick,.related [data-tid],button.trow');if(!r)return;if(r.dataset.tid)openTender(r.dataset.tid);else open(r.dataset.id);});

// --- router
function go(){save();if(location.hash==='#calendar'||location.hash==='#deadlines'){history.replaceState(null,'',location.pathname+location.search);}
  {const h0=location.hash.slice(1);if(h0.startsWith('find?'))applyShare(h0.slice(5));if(h0==='map'||h0.startsWith('need-')){if(h0.startsWith('need-')){const NT={research:'research',industry:'industry',intl:'eu',commercialise:'spinout',invest:'spinout',companyrd:'company',tax:'company',people:'people',infra:'services'};mapSt.by='type';mapSt.sel=NT[h0.slice(5)]||null;}else mapSt.sel=null;mapSt.overview=true;history.replaceState(null,'',location.pathname+location.search);pendingMapScroll=true;st.view='map';}}
  document.querySelectorAll('.seg button[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===st.mode));
  st.mil=true;milEl.checked=true;
  const h=location.hash.slice(1);const v=h.startsWith('need-')?'need':['all','tenders','saved','compare','sources','profile'].includes(h)?h:'home';
  ['home','need','all','tenders','saved','compare','sources','profile'].forEach(x=>document.getElementById('v-'+x).hidden=x!==v);
  document.querySelectorAll('.links a').forEach(a=>a.setAttribute('aria-current',a.id==='shareTop'?'false':(a.getAttribute('href')==='#'+h||(a.id==='homeLink'&&(v==='home'||v==='need')))?'page':'false'));
  if(v==='home')renderHome();if(v==='need')renderNeed(h.slice(5));if(v==='all')renderAll();if(v==='tenders')renderTenders();if(v==='saved')renderSaved();if(v==='compare')renderCompare();if(v==='sources')renderSources();if(v==='profile')renderProfile();savedLink();cmpBar();close();}
ideaEl.value=st.text;
window.addEventListener('hashchange',()=>{window.scrollTo(0,0);go();});
go();
})();
</script>
